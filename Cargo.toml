[package]
name = "watchcat"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "sing-box outbound watchdog: Clash API health detection and selector failover"
license = "GPL-3.0-only"
publish = false

[dependencies]
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "time",
    "macros",
    "sync",
    "signal",
] }
nom = { version = "8", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
serde_yaml = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "watchcat"
path = "src/main.rs"

[[bin]]
name = "mock-clash"
path = "src/bin/mock_clash.rs"
