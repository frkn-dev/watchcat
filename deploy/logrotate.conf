# Журнал изменений маршрутизации watchcat.
#
# copytruncate: демон держит файл открытым (append) и не переоткрывает его по
# сигналу, поэтому ротация без copytruncate оставила бы демон писать в
# переименованный inode. Копия затем сжимается и хранится 90 дней.
#
# Проверка: logrotate -d /etc/logrotate.d/watchcat

/var/log/watchcat/routes.jsonl {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
}

# Текстовый файл метрик перезаписывается атомарно каждым тиком; ротация ему не
# нужна, но полезен кап на размер, если демон залипнет.
/var/log/watchcat/metrics.prom {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
    su root root
}
